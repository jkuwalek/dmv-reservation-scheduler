[project]
name = "dmvwatch"
version = "0.1.0"
description = "Watches DMV reservation calendars for cancelled appointments"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0",
    "click>=8.1.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.3",
    "arq>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmvwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["dmvwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real DMV site; deselected by default"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
